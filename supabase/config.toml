project_id = "kfm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Catches any mail the stack would have sent, viewable at :54324.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions.create-fighter]
verify_jwt = true

[functions.challenge]
verify_jwt = true

[functions.submit-round]
verify_jwt = true

[functions.power-up]
verify_jwt = true

[functions.sweep-deadlines]
verify_jwt = false
